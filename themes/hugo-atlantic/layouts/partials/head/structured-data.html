{{ if .IsPage }}
{{- $image := "" -}}
{{- with .Resources.GetMatch .Params.image }}{{ $image = .Permalink }}{{ end -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  {{ with .Params.description }}"description": {{ . | jsonify }},{{ end }}
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
  {{ with .Params.author.name }}"author": { "@type": "Person", "name": {{ . | jsonify }} },{{ end }}
  "publisher": { "@type": "Organization", "name": {{ .Site.Title | jsonify }} }
  {{ with $image }}, "image": {{ . | jsonify }}{{ end }}
  {{ with .Params.tags }}, "keywords": {{ . | jsonify }}{{ end }}
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }}
}
</script>
{{ end }}
