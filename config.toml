baseURL = "https://hikewithyu.com/"
languageCode = "en-us"
title = "Hiking With Yu"
themesDir="themes"
theme = "hugo-atlantic"
enableRobotsTXT = true
enableGitInfo = false
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true
metaDataFormat = "yaml"
timeout = "3600s"

[params]
  commentbox_project_id = "5668223957598208-proj"
  google_analytics_id = "G-H3H5S61VMW"
  description = "Hiking With Yu is a blog about backpacking adventures in the Pacific Northwest and beyond, featuring trail guides, gear reviews, and outdoor tips."

[params.homepage]
  postLimit = 15

[params.logo]
  showLogoTextOnDesktop = true
  showLogoTextOnMobile = true
  showLogoImageOnDesktop = true
  showLogoImageOnMobile = true
  logoDesktopText = "Hiking With Yu"
  logoDesktopImage = "images/logo/logo.png"
  logoMobileText = ""
  logoMobileImage = "images/logo/logo.png"
  logoDesktopImageHeight = 48
  logoDesktopImageWidth = 48
  logoMobileImageHeight = 32
  logoMobileImageWidth = 32

[params.fonts]
  google_fonts = "https://fonts.googleapis.com/css2?family=Fira+Mono&family=Lato:wght@300;400;700&family=Source+Sans+Pro&display=swap"
  heading = "Lato"
  base = "Source Sans Pro"
  monospace = "Fira Mono"

[params.seo]
  meta_twitter_site = "@yucombinator"
  meta_twitter_creator = "@yucombinator"
  meta_og_image = "https://hikewithyu.com/images/trips/copper-ridge-loop.jpg"

[build]
  writeStats = true

[permalinks]
  posts = "blog/:year/:month/:title/"
  pages = ":slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[related]
  threshold = 80
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[pagination]
  pagerSize = 10

[markup.goldmark.renderer]
 unsafe = true
