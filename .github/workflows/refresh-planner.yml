# Nightly data refresh for the Algonquin Planner:
# re-fetch OSM + conditions inputs, rebuild the graph, commit if anything changed.
name: Refresh planner data

on:
  schedule:
    # 06:20 and 18:20 UTC: the volatile part (park conditions) gets checked
    # twice a day; the OSM groups below are age-gated inside fetch_osm.py, so a
    # run only spends requests on the snapshots that are actually stale.
    - cron: "20 6,18 * * *"
  workflow_dispatch:
  # Editing this file re-runs the refresh, so a pipeline fix proves itself
  # immediately instead of waiting for the next cron slot.
  push:
    paths:
      - .github/workflows/refresh-planner.yml

permissions:
  contents: write

concurrency:
  group: planner-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The test step runs node:test as well as unittest. Pinning it matters:
      # the runner's preinstalled Node is whatever the image ships, and the
      # test runner's argument handling changed at 21.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The OSM tile cache is ~290 MB and stays out of git, so it rides the Actions
      # cache instead. Without it every nightly run re-downloads every tile from
      # Overpass and dies on rate limits. Rolling key: last good cache is restored
      # and refreshed after each successful fetch.
      - name: Restore OSM tile cache
        uses: actions/cache@v4
        with:
          path: tools/algonquin-graph/raw
          key: osm-tiles-${{ github.run_id }}
          restore-keys: |
            osm-tiles-

      - name: Cache hit info
        run: |
          n=$(ls tools/algonquin-graph/raw/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "cached OSM snapshots: $n"
          if [ "$n" -lt 10 ]; then
            echo "::warning::tile cache cold — this run does a full re-download and may be slow"
          fi

      - name: Refresh park conditions (daily-ish; this is what actually moves)
        run: python3 tools/algonquin-graph/fetch_conditions.py

      - name: Fetch OSM groups that are past their age budget
        env:
          OVERPASS_TOLERANT: "1"     # a dead mirror must not kill the run
          OVERPASS_BACKOFF: "20"
        run: python3 tools/algonquin-graph/fetch_osm.py

      - name: Parse graph
        run: |
          cd tools/algonquin-graph
          python3 parse_osm.py
          python3 build_access_geo.py
          python3 fetch_elevations.py
          python3 build_page.py

      # Golden routes per cost model, the drawing invariants that keep
      # regressing, and the pipeline units. These run on the freshly built
      # payload, so a data refresh that breaks the router is caught here
      # rather than on the live site. No test framework to install: node:test
      # and unittest are both stdlib.
      - name: Run tests
        run: sh tools/algonquin-graph/tests/run.sh

      # Guards against the silent-drift class of bug: a stale generator writing
      # a payload missing fields the UI reads (e.g. elevation profiles).
      - name: Verify payload integrity
        run: |
          python3 - <<'PY'
          import datetime, json, sys, os
          d = json.load(open('data/router_data.json'))
          # A partial fetch (rate-limited tiles) must not silently shrink the
          # graph. Compare against the payload that is live right now.
          ref = 'content/algonquin/router_data.json'
          if os.path.exists(ref):
              prev = json.load(open(ref))
              for key, label in (('edges', 'edges'), ('nodes', 'nodes')):
                  before, after = len(prev.get(key, [])), len(d.get(key, []))
                  if after < before * 0.95:
                      sys.exit(f"payload shrank: {label} {before} -> {after} "
                               "(incomplete OSM fetch; re-run to fill the cache)")
          p = [e for e in d['edges'] if e['k'] == 'portage']
          prof = sum(1 for e in p if e.get('pf'))
          climb = sum(1 for e in p if e.get('el') is not None)
          camps = len(d.get('campsites') or [])
          roads = bool(d.get('roads'))
          dm = sum(1 for n in d['nodes'] if len(n) > 5)
          conds = d.get("conds") or []

          bad = []
          if len(p) and prof < len(p) * 0.9: bad.append("elevation profiles missing")
          if len(p) and climb < len(p) * 0.9: bad.append("climb data missing")
          if camps == 0: bad.append("no campsites")
          if not roads: bad.append("no Hwy 60")

          # Park advisories are the safety-relevant part of this payload, and
          # fetch_conditions.py deliberately keeps the previous file when a run
          # extracts nothing (so a transient outage does not blank the briefing).
          # That means a silently broken scrape used to pass this job green and
          # ship stale advisories. So check the stamp, not just the row count.
          if not conds:
              bad.append("no park conditions at all")
          else:
              today = datetime.date.today()
              stamps = []
              for c in conds:
                  try:
                      stamps.append(datetime.date.fromisoformat(c.get("as_of") or ""))
                  except ValueError:
                      bad.append(f"unparseable as_of {c.get('as_of')!r}")
              if stamps:
                  newest = max(stamps)
                  age = (today - newest).days
                  oldest = min(stamps)
                  print(f"advisories: {len(conds)} rows, newest as_of {newest} "
                        f"({age}d old), oldest {oldest}")
                  if age > 2:
                      bad.append(f"advisories are {age}d stale (as_of {newest}); "
                                 "the advisories scrape is probably broken")
                  if age < 0:
                      bad.append(f"advisories as_of {newest} is in the future")

          print(f"portages={len(p)} profiles={prof} climb={climb} "
                f"campsites={camps} roads={roads} dm_nodes={dm} conds={len(conds)}")
          if bad:
              sys.exit("payload incomplete: " + ", ".join(bad))
          PY

      - name: Deploy refreshed app into the page bundle
        run: |
          cp tools/algonquin-graph/index.html content/algonquin/app.html
          cp tools/algonquin-graph/router_data.json content/algonquin/router_data.json
          cp tools/algonquin-graph/router.js content/algonquin/router.js

      # The app ships as three files that are produced by different steps, so a
      # partial deploy is possible: a fresh app.html beside a stale router.js
      # loads, renders, and only then dies with "Router.x is not a function" —
      # which is exactly how overlapTracker broke route drawing. Verify the
      # bundle we just deployed actually agrees with itself.
      - name: Verify the deployed bundle agrees with itself
        env:
          # absolute: the unittest runs from the repo root, and a relative
          # path here silently pointed at a directory that does not exist
          ALGONQUIN_BUNDLE: ${{ github.workspace }}/content/algonquin
        run: |
          python3 -m unittest discover -s tools/algonquin-graph/tests -p "test_api*.py" -v

      - name: Commit if data changed
        run: |
          git config user.name "planner-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/algonquin tools/algonquin-graph/data
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "Nightly planner data refresh ($(date -u +%F))"
            git push
          fi
