# OSM graph refresh for the Algonquin Planner.
#
# Runs 90 minutes after the advisories workflow (07:50 and 19:50 UTC) rather
# than alongside it. `on.schedule` applies to a whole workflow, not to
# individual jobs, so the only way to offset the two is separate files — and
# separate files also mean separate concurrency groups, so one job's push never
# cancels the other's run.
#
# Own timeout, and it has to be ABOVE this chain's own runtime: the work is
# 2h51m (1h32m of it Overpass) and the ceiling used to be 150 minutes, so a run
# that behaved as documented could never finish. Worse, the fetch is slowest
# when the tile cache is cold, and the cache is only ever saved when the job
# succeeds — so a cold fetch that overran the ceiling guaranteed the next run
# was cold too. Run #3 hit 150 minutes in the fetch and was killed there.
# 300 leaves an hour over the documented worst case and still sits under the
# 6-hour hosted-runner limit.
name: Refresh planner graph

on:
  schedule:
    # 07:50 and 19:50 UTC — offset from the advisories run at 06:20/18:20
    - cron: "50 7,19 * * *"
  workflow_dispatch:
  # A change to the pipeline is a change to what this job runs, so it has to
  # trigger a run. Watching only the workflow file meant the fetch_osm.py
  # changes that make the refresh survivable sat untested until the next
  # schedule — which on this repo has been arriving hours late.
  push:
    paths:
      - .github/workflows/refresh-graph.yml
      - tools/algonquin-graph/fetch_osm.py
      - tools/algonquin-graph/parse_osm.py
      - tools/algonquin-graph/build_page.py

permissions:
  contents: write

# The fetch alone has taken 1h32m. Cancelling an in-flight run throws that
# away, so a run that has started is allowed to finish and the next is
# skipped. Stale by a cycle beats never.
concurrency:
  group: planner-graph
  cancel-in-progress: false

jobs:
  # Serial by nature: fetch feeds parse feeds the payload, so splitting these
  # across parallel jobs would gain nothing. What this chain needs is room to
  # breathe and failures that are visible on their own.
  graph:
    name: OSM graph
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The test step runs node:test as well as unittest. Pinning it matters:
      # the runner's preinstalled Node is whatever the image ships, and the
      # test runner's argument handling changed at 21.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The OSM tile cache is ~290 MB and stays out of git, so it rides the
      # Actions cache instead. Without it every run re-downloads every tile
      # from Overpass and dies on rate limits. Rolling key: the last good
      # cache is restored and refreshed after each successful fetch.
      - name: Restore OSM tile cache
        uses: actions/cache@v4
        with:
          path: tools/algonquin-graph/raw
          key: osm-tiles-${{ github.run_id }}
          restore-keys: |
            osm-tiles-

      - name: Cache hit info
        run: |
          n=$(ls tools/algonquin-graph/raw/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "cached OSM snapshots: $n"
          if [ "$n" -lt 10 ]; then
            echo "::warning::tile cache cold — this run does a full re-download and may be slow"
          fi

      - name: Fetch OSM groups that are past their age budget
        env:
          OVERPASS_TOLERANT: "1"     # a dead mirror must not kill the run
          OVERPASS_BACKOFF: "20"
          # Wall clock, not "however long Overpass takes". Runs #3 and #4 died
          # at the job ceiling mid-fetch and #5 spent 3h50m on it. The fetch now
          # stops when this is spent and carries over each group's last good
          # snapshot, so a bad Overpass day costs freshness, not the run.
          FETCH_DEADLINE_MINUTES: "45"
        run: python3 tools/algonquin-graph/fetch_osm.py

      # Bank the tiles the moment they are paid for. actions/cache's own
      # post-job save only runs when the job succeeds, so a failure anywhere in
      # the four steps after this one threw the whole Overpass fetch away and
      # left the next run cold — which is what made the fetch the step that
      # overran its ceiling. The expensive work should not depend on the
      # fragile tail. Partial fetches are still worth keeping: the payload
      # shrink guard downstream is what catches a re-download that came back
      # short.
      - name: Save the OSM tile cache now, not in post
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/algonquin-graph/raw
          key: osm-tiles-${{ github.run_id }}

      # The official access point list comes from the park's own pages, and
      # nothing used to fetch them: raw/ap_pages/ is gitignored, so a clean
      # runner had none and parse_osm was free to write an empty table over a
      # good one. That deleted all 29 access points once already. parse_osm no
      # longer empties the table it cannot populate, so this step is an
      # improvement rather than a rescue — it is what keeps the numbers and
      # names tracking the park. Cached for 30 days, paced, and one dead page
      # is a warning, not a failure.
      - name: Refresh the official access point pages
        continue-on-error: true
        run: python3 tools/algonquin-graph/fetch_access_pages.py

      - name: Parse graph
        run: |
          cd tools/algonquin-graph
          python3 parse_osm.py
          python3 build_access_geo.py
          python3 fetch_elevations.py
          python3 build_page.py

      # Golden routes per cost model, the drawing invariants that keep
      # regressing, and the pipeline units. No test framework to install:
      # node:test and unittest are both stdlib.
      #
      # Advisory, not a gate. This job exists to refresh the graph, and a unit
      # test must never be the reason it stops updating. The gate that actually
      # matters, whether the page agrees with the router it ships beside, lives
      # in pages.yml where it can block a deploy.
      - name: Run tests (advisory)
        continue-on-error: true
        run: |
          sh tools/algonquin-graph/tests/run.sh || \
            echo "::error::planner tests failed; the data refresh continues anyway"

      # Guards against the silent-drift class of bug: a stale generator writing
      # a payload missing fields the UI reads (e.g. elevation profiles).
      - name: Verify payload integrity
        # Absolute paths, for the same reason ALGONQUIN_BUNDLE below is: this
        # step runs from the workspace root, but build_page.py writes the
        # payload under tools/algonquin-graph and never to ./data. The
        # relative 'data/router_data.json' raised FileNotFoundError on its
        # first line, which threw away a 2h51m refresh at the second-to-last
        # step — every run. It also meant the OSM tile cache was never saved,
        # so every run re-downloaded every tile and went cold again.
        env:
          BUILT_PAYLOAD: ${{ github.workspace }}/tools/algonquin-graph/data/router_data.json
          LIVE_PAYLOAD: ${{ github.workspace }}/content/algonquin/router_data.json
        run: |
          python3 - <<'PY'
          import datetime, json, sys, os
          d = json.load(open(os.environ['BUILT_PAYLOAD']))
          # A partial fetch (rate-limited tiles) must not silently shrink the
          # graph. Compare against the payload that is live right now.
          #
          # This used to be sys.exit, and that made the refresh impossible to
          # complete on any day Overpass was unhappy: the data on the site is
          # still the best available, so refusing to replace it is correct, but
          # failing the job over it just guarantees it never recovers. Record
          # the verdict and let the commit step skip. The advisory half of this
          # product — park conditions — is a separate workflow and is not
          # affected.
          ref = os.environ['LIVE_PAYLOAD']
          hold = os.path.join(os.environ.get('GITHUB_WORKSPACE', '.'), '.hold-commit')
          if os.path.exists(ref):
              prev = json.load(open(ref))
              for key, label in (('edges', 'edges'), ('nodes', 'nodes')):
                  before, after = len(prev.get(key, [])), len(d.get(key, []))
                  if after < before * 0.95:
                      open(hold, 'w').close()
                      print(f"HOLD: payload shrank: {label} {before} -> {after} "
                            "(incomplete OSM fetch — keeping the live data)")
          p = [e for e in d['edges'] if e['k'] == 'portage']
          prof = sum(1 for e in p if e.get('pf'))
          climb = sum(1 for e in p if e.get('el') is not None)
          camps = len(d.get('campsites') or [])
          roads = bool(d.get('roads'))
          dm = sum(1 for n in d['nodes'] if len(n) > 5)
          conds = d.get("conds") or []

          bad = []
          if len(p) and prof < len(p) * 0.9: bad.append("elevation profiles missing")
          if len(p) and climb < len(p) * 0.9: bad.append("climb data missing")
          if camps == 0: bad.append("no campsites")
          if not roads: bad.append("no Hwy 60")
          # The advisories themselves are owned by refresh-advisories.yml and
          # checked there; only confirm the payload carries what was built.
          if not conds:
              bad.append("no park conditions in the payload")
          elif conds:
              newest = max(datetime.date.fromisoformat(c["as_of"]) for c in conds)
              print(f"advisories in payload: {len(conds)} rows, newest as_of {newest}")

          print(f"portages={len(p)} profiles={prof} climb={climb} "
                f"campsites={camps} roads={roads} dm_nodes={dm} conds={len(conds)}")
          if bad:
              # Missing fields are a pipeline regression, not a network day:
              # that one is worth failing the run over.
              sys.exit("payload incomplete: " + ", ".join(bad))
          if os.path.exists(hold):
              print("::warning::new payload is smaller than the live one — "
                    "keeping the live data, the next run tops the cache up")
          PY

      - name: Deploy refreshed app into the page bundle
        run: |
          cp tools/algonquin-graph/index.html content/algonquin/app.html
          cp tools/algonquin-graph/router_data.json content/algonquin/router_data.json
          cp tools/algonquin-graph/router.js content/algonquin/router.js

      # The app ships as three files produced by different steps, so a partial
      # deploy is possible: a fresh app.html beside a stale router.js loads,
      # renders, and only then dies with "Router.x is not a function" — which
      # is exactly how overlapTracker broke route drawing. Verify the bundle we
      # just deployed actually agrees with itself.
      - name: Verify the deployed bundle agrees with itself
        env:
          # absolute: the unittest runs from the repo root, and a relative
          # path here silently pointed at a directory that does not exist
          ALGONQUIN_BUNDLE: ${{ github.workspace }}/content/algonquin
        run: |
          python3 -m unittest discover -s tools/algonquin-graph/tests -p "test_api*.py" -v

      - name: Commit if data changed
        run: |
          git config user.name "planner-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f .hold-commit ]; then
            # The integrity check found a payload smaller than the live one, so
            # this run's fetch came back short. The data on the site is still
            # the best available; keep it and let the next run top the tile
            # cache up. Failing here instead would mean one bad Overpass day
            # could stop the refresh permanently.
            echo "::warning::payload did not improve — keeping the live data"
            echo "No data changes — skipping commit"
          else
            git add content/algonquin tools/algonquin-graph/data
            if git diff --cached --quiet; then
              echo "No data changes — skipping commit"
            else
              # Commit BEFORE reconciling with the branch. This used to pull
              # first, with --autostash: the autostash pop restores changes
              # UNSTAGED, so the commit on the next line had nothing staged
              # and died with "no changes added to commit". Every refresh that
              # had data to save hit it, which is why the repo had never once
              # landed a "Refresh planner graph" commit.
              git commit -m "Refresh planner graph ($(date -u +%F))"
              # A commit does NOT leave the tree clean. `git add` above covers
              # content/algonquin and tools/algonquin-graph/data, but build_page.py
              # also writes tools/algonquin-graph/index.html and
              # tools/algonquin-graph/router_data.json. Those are intermediates
              # that content/algonquin supersedes, so they are discarded rather
              # than committed — and the tree has to be clean before the rebase
              # below, which refuses outright with "You have unstaged changes".
              # A human push landing mid-run is exactly what triggers that path,
              # so this was the failure mode, not a rare edge.
              git checkout -- .
              # actions/checkout leaves a detached HEAD, so the push has to
              # name the ref. The advisories job can land a commit while this
              # chain runs, so rebase onto whatever master is now.
              git fetch origin master
              if git rebase origin/master; then
                git push origin HEAD:master
              else
                git rebase --abort || true
                # A human edited a build product mid-run. Our bundle came from
                # the template as of the checkout at the start of the run, so
                # master's copy is the newer one under content/algonquin — take
                # it, and keep our refreshed graph data everywhere else.
                echo "::warning::rebase conflicted; merging instead, keeping master on conflict"
                git merge -X theirs -m "Refresh planner graph ($(date -u +%F))" origin/master
                git push origin HEAD:master
              fi
            fi
          fi
